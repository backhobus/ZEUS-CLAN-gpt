  <style>
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Batang:wght@400;700&family=Orbitron:wght@500;600;700;800&display=swap');
    :root {
      --bg:#08090c; --panel:#111318; --panel-2:#171a20; --gold:#f0d86b;
      --gold-2:#c8a944; --cream:#f3edcf; --muted:#a8a7a0; --line:rgba(240,216,107,.22);
      --red:#ff6b6b; --shadow:0 24px 70px rgba(0,0,0,.48);
    }
    * { box-sizing:border-box; }
    html { min-height:100%; scroll-behavior:smooth; }
    body {
      margin:0; min-height:100vh; color:var(--cream); background:
        radial-gradient(ellipse at 50% 3%, rgba(110,113,129,.18), transparent 38%),
        radial-gradient(ellipse at 12% 62%, rgba(180,145,54,.09), transparent 34%),
        radial-gradient(ellipse at 87% 78%, rgba(92,104,126,.12), transparent 35%),
        linear-gradient(145deg,#06070a,#0b0d12 54%,#07080b);
      font-family:'Gowun Batang',serif; overflow-x:hidden; line-height:1.75; word-break:keep-all; overflow-wrap:break-word;
    }
    body:before {
      content:""; position:fixed; inset:0; pointer-events:none; opacity:.18; z-index:0;
      background-image:radial-gradient(1px 1px at 18% 23%,#fff,transparent),radial-gradient(1px 1px at 78% 17%,#fff,transparent),radial-gradient(1px 1px at 62% 70%,#fff,transparent),radial-gradient(1px 1px at 32% 84%,#fff,transparent),radial-gradient(1px 1px at 91% 55%,#fff,transparent);
      background-size:370px 290px;
    }
    .lightning { position:fixed; width:300px; height:420px; opacity:.09; pointer-events:none; z-index:0; filter:blur(.2px); }
    .lightning.left { top:8%; left:-170px; transform:rotate(-14deg); }
    .lightning.right { bottom:0; right:-160px; transform:rotate(166deg); }
    .lightning path { fill:none; stroke:#d6d9e5; stroke-width:2.4; stroke-linecap:round; }
    /* 동적 번개: 메인 화면에서만 표시 (신청서·명예의 전당에서는 body.calm 으로 모두 숨김) */
    #stormCanvas { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }
    #stormFlash { position:fixed; inset:0; pointer-events:none; z-index:0; opacity:0; --fx:50%;
      background:radial-gradient(ellipse 85% 70% at var(--fx) 0%, rgba(255,224,90,.55), rgba(214,170,40,.14) 48%, transparent 74%); }
    body.calm .lightning, body.calm #stormCanvas, body.calm #stormFlash { display:none !important; }
    .shell { position:relative; z-index:1; width:min(100% - 36px, 900px); margin:0 auto; padding:30px 0 56px; }
    .topline { display:flex; align-items:center; justify-content:space-between; gap:12px; color:#918d7b; font:10px 'Orbitron',sans-serif; letter-spacing:.22em; text-transform:uppercase; }
    .topline .crest { color:var(--gold); }
    .hero { text-align:center; padding:46px 0 34px; animation:rise .8s ease both; }
    .logo-wrap { position:relative; width:clamp(150px,30vw,218px); aspect-ratio:1; margin:0 auto 23px; border-radius:50%; padding:5px; background:linear-gradient(145deg,#fff2a1,#a98a32 40%,#fff0a0 70%,#6e5720); box-shadow:0 0 0 1px rgba(255,239,164,.2),0 0 42px rgba(216,185,78,.13); }
    .logo-wrap:after { content:""; position:absolute; inset:-11px; border:1px solid rgba(240,216,107,.32); border-radius:50%; }
    .logo-wrap img { display:block; width:100%; height:100%; border-radius:50%; object-fit:contain; object-position:50% 50%; }
    .since { display:inline-flex; align-items:center; gap:12px; color:var(--gold); font:700 13px 'Cinzel','Times New Roman',serif; letter-spacing:.33em; }
    .since:before,.since:after { content:""; display:block; width:34px; height:1px; background:linear-gradient(90deg,transparent,var(--gold)); }
    .since:after { transform:scaleX(-1); }
    .hero .since { font-family:'Cinzel','Trajan Pro','Times New Roman',serif !important; font-weight:700; font-size:14px; }
    h1 { margin:12px 0 7px; font:clamp(35px,8vw,67px) 'Orbitron',sans-serif; font-weight:800; line-height:1.02; letter-spacing:.075em; color:#f5e9b2; text-shadow:0 3px 20px rgba(240,216,107,.18); }
    .subtitle { width:min(100%,420px); margin:12px auto 0; padding:0 8px; color:#d8d0ae; font-size:clamp(13px,2.7vw,17px); letter-spacing:.025em; line-height:1.65; }
    .subtitle strong { color:#89877e; font-weight:700; }
    .subtitle .hero-word { color:var(--gold); }
    .subtitle .legend-word { color:#b68cff; }
    .hero-note { display:block; width:min(100%,470px); margin:21px auto 0; padding:0 12px; color:#89877e; font-size:11px; letter-spacing:.045em; line-height:1.9; text-align:center; }
    .hero-note span { color:var(--gold-2); display:inline-block; margin:0 4px; }
    .rule { height:1px; margin:18px auto 31px; width:min(100%,560px); background:linear-gradient(90deg,transparent,rgba(240,216,107,.55),transparent); }
    .action-area { width:min(100%,650px); margin:0 auto; display:grid; grid-template-columns:1fr 1fr; gap:13px; }
    .action {
      position:relative; min-height:76px; overflow:hidden; border:1px solid rgba(240,216,107,.38); border-radius:13px;
      background:linear-gradient(135deg,rgba(32,31,27,.96),rgba(16,18,23,.96)); color:var(--cream);
      display:flex; align-items:center; justify-content:center; gap:12px; padding:18px 19px; cursor:pointer;
      font-family:'Gowun Batang',serif; font-size:16px; font-weight:700; letter-spacing:.015em; line-height:1.55; text-align:center;
      box-shadow:0 9px 28px rgba(0,0,0,.24); transition:transform .2s,border-color .2s,box-shadow .2s;
    }
    .action:before { content:""; position:absolute; inset:0; background:linear-gradient(110deg,transparent 20%,rgba(255,244,189,.08),transparent 76%); transform:translateX(-110%); transition:transform .65s; }
    .action:hover { transform:translateY(-3px); border-color:rgba(255,231,139,.86); box-shadow:0 13px 34px rgba(188,151,52,.13); }
    .action:hover:before { transform:translateX(110%); }
    /* Discord button: muted brand-blue treatment tuned for the dark ZEUS background. */
    .action#discordButton {
      background:linear-gradient(135deg,rgba(88,101,242,.25),rgba(65,76,180,.19) 48%,rgba(17,20,29,.97));
      border-color:rgba(116,129,255,.48);
      box-shadow:0 9px 28px rgba(0,0,0,.24),inset 0 1px 0 rgba(174,183,255,.07);
    }
    .action#discordButton:before {
      background:linear-gradient(110deg,transparent 20%,rgba(151,164,255,.13),transparent 76%);
    }
    .action#discordButton:hover {
      border-color:rgba(151,164,255,.88);
      box-shadow:0 13px 34px rgba(88,101,242,.20),0 0 18px rgba(88,101,242,.08);
    }
    .action#discordButton .symbol { color:#9aa4ff; }
    .action.primary { grid-column:1 / -1; min-height:91px; background:linear-gradient(110deg,#4c3d17,#191812 48%,#413516); border-color:#e4c65a; font-size:19px; }
    .action .symbol { color:var(--gold); font-size:21px; line-height:1; }
    .action .arrow { color:#a58e48; font:14px 'Orbitron',sans-serif; }
    .footer { margin:40px auto 0; text-align:center; color:#5e5f62; font:9px 'Orbitron',sans-serif; letter-spacing:.24em; }
    .view { animation:rise .35s ease both; }
    .hidden { display:none !important; }
    .back-home { display:inline-flex; align-items:center; gap:8px; padding:8px 0; color:#a9a18a; background:none; border:0; cursor:pointer; font:12px 'Gowun Batang',serif; }
    .back-home:hover { color:var(--gold); }
    .panel { width:min(100%,680px); margin:14px auto 0; padding:clamp(22px,5vw,42px); border:1px solid var(--line); border-radius:19px; background:linear-gradient(145deg,rgba(23,25,31,.96),rgba(11,13,17,.97)); box-shadow:var(--shadow); position:relative; overflow:hidden; }
    .panel:before { content:""; position:absolute; top:0; left:12%; right:12%; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); }
    .eyebrow { color:var(--gold-2); font:10px 'Orbitron',sans-serif; letter-spacing:.2em; text-transform:uppercase; }
    .panel h2 { margin:10px 0 8px; font-size:clamp(22px,5vw,30px); line-height:1.55; font-weight:700; color:#f0e7c3; word-break:keep-all; }
    .description { margin:0; color:#999894; font-size:12px; line-height:1.9; word-break:keep-all; }
    .progress-row { display:flex; justify-content:space-between; align-items:center; margin:23px 0 9px; color:#938f7f; font:10px 'Orbitron',sans-serif; letter-spacing:.1em; }
    .progress-row strong { color:var(--gold); font-weight:600; }
    .progress { height:3px; border-radius:9px; background:#34343a; overflow:hidden; }
    .progress > span { display:block; height:100%; background:linear-gradient(90deg,#a98b36,#f3df87); transition:width .62s cubic-bezier(.22,1,.36,1); will-change:width; }
    .question { margin-top:30px; }
    .question label { display:block; max-width:100%; margin:0 0 14px; color:#e8dfbf; font-size:15px; font-weight:700; line-height:1.8; word-break:keep-all; }
    .field,.field-area {
      width:100%; color:#f2edda; background:#0b0d11; border:1px solid #363740; border-radius:10px; outline:none;
      padding:16px 17px; font:14px/1.8 'Gowun Batang',serif; transition:border-color .2s,box-shadow .2s; caret-color:var(--gold); word-break:keep-all;
    }
    .field { min-height:55px; }
    .field-area { min-height:145px; resize:vertical; line-height:1.7; }
    .field::placeholder,.field-area::placeholder { color:#777875; opacity:1; }
    .field:focus,.field-area:focus { border-color:var(--gold-2); box-shadow:0 0 0 3px rgba(211,177,75,.09); }
    .error { min-height:19px; margin:8px 1px 0; color:var(--red); font-family:Arial,sans-serif; font-size:12px; }
    .choice-row { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
    .choice { min-height:57px; color:#c6c2b0; border:1px solid #44444a; border-radius:10px; background:#0d0f13; font:700 15px 'Gowun Batang',serif; cursor:pointer; transition:.2s; }
    .choice:hover { border-color:#a58e48; }
    .choice.selected { color:#17150e; border-color:#e8cf70; background:linear-gradient(125deg,#f3df8b,#c6a648); box-shadow:0 5px 20px rgba(208,174,71,.13); }
    .nav-row { display:grid; grid-template-columns:1fr 9fr; gap:10px; margin-top:28px; }
    .nav-btn,.submit-btn { min-height:53px; border-radius:10px; cursor:pointer; font:700 14px 'Gowun Batang',serif; transition:.2s; }
    .nav-btn.prev { color:#a9a493; background:#17191e; border:1px solid #393a40; }
    .nav-btn.prev:disabled { opacity:.38; cursor:not-allowed; }
    .nav-btn.next,.submit-btn { color:#17150d; border:1px solid #e5ca68; background:linear-gradient(110deg,#f2dc80,#c6a348); box-shadow:0 6px 22px rgba(201,166,65,.14); }
    .nav-btn.next:hover,.submit-btn:hover { filter:brightness(1.08); transform:translateY(-1px); }
    .review-head { text-align:center; }
    .review-list { margin:27px 0 0; border-top:1px solid rgba(240,216,107,.17); }
    .review-item { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:13px; align-items:center; padding:16px 0; border-bottom:1px solid rgba(255,255,255,.07); }
    .review-item .label { color:#9a967f; font-size:11px; margin-bottom:6px; }
    .review-item .answer { color:#eee8d4; font-size:13px; line-height:1.65; overflow-wrap:anywhere; white-space:pre-wrap; }
    .edit-btn { color:var(--gold); background:transparent; border:1px solid rgba(240,216,107,.38); padding:8px 12px; border-radius:8px; font:12px 'Gowun Batang',serif; cursor:pointer; }
    .edit-btn:hover { background:rgba(240,216,107,.1); }
    .submit-btn { width:100%; margin-top:24px; min-height:57px; font-size:16px; }
    .completion { text-align:center; padding:30px 8px 26px; }
    .completion .check { display:grid; place-items:center; width:88px; height:88px; padding:4px; margin:0 auto 23px; border:1px solid rgba(255,239,164,.65); border-radius:50%; background:linear-gradient(145deg,#fff2a1,#a98a32 40%,#fff0a0 70%,#6e5720); box-shadow:0 0 0 1px rgba(255,239,164,.18),0 0 33px rgba(224,192,88,.18); }
    .completion .check img { display:block; width:100%; height:100%; border-radius:50%; object-fit:cover; }
    .completion h2 { max-width:100%; margin:0 auto 12px; font-size:clamp(22px,5vw,27px); line-height:1.55; color:#f5e6a9; }
    .completion p { max-width:420px; margin:0 auto; color:#bab5a2; font-size:13px; line-height:2; }
    .completion .small { margin-top:22px; color:#77766e; font-size:11px; }
    .gallery-title { text-align:center; margin:8px 0 24px; line-height:1.8; }
    .gallery-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px; }
    .gallery-card { border:1px solid rgba(240,216,107,.24); border-radius:12px; overflow:hidden; background:#090b0f; }
    .gallery-card img { display:block; width:100%; aspect-ratio:4/3; object-fit:cover; }
    .gallery-card p { margin:0; padding:10px; color:#c6bd9e; font-size:11px; overflow-wrap:anywhere; }
    .empty-gallery { min-height:108px; display:flex; align-items:center; justify-content:center; padding:30px 15px; text-align:center; color:#929087; border:1px dashed rgba(240,216,107,.24); border-radius:12px; font-size:13px; line-height:2; word-break:keep-all; }
    .toast { position:fixed; z-index:20; left:50%; bottom:24px; transform:translate(-50%,20px); opacity:0; pointer-events:none; max-width:calc(100vw - 32px); padding:13px 18px; color:#f6eecf; background:#24252a; border:1px solid rgba(240,216,107,.35); border-radius:10px; box-shadow:var(--shadow); font:12px/1.6 Arial,sans-serif; transition:.25s; text-align:center; }
    .toast.show { transform:translate(-50%,0); opacity:1; }
    .toast.warning { border-color:rgba(255,107,107,.6); }
    .loader { display:inline-block; width:14px; height:14px; border:2px solid rgba(0,0,0,.25); border-top-color:#16140d; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:8px; }
    @keyframes rise { from { opacity:0; transform:translateY(11px); } to { opacity:1; transform:translateY(0); } }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (max-width:520px) {
      .shell { width:min(100% - 28px,900px); padding-top:20px; }
      .since { letter-spacing:.22em; }
      h1 { letter-spacing:.045em; line-height:1.15; }
      .subtitle { max-width:340px; font-size:14px; line-height:1.8; }
      .hero-note { max-width:350px; font-size:11px; line-height:2; }
      .question { margin-top:25px; }
      .question label { font-size:14px; line-height:1.9; }
      .age-range-field::placeholder { font-size:clamp(8px,2.35vw,9px); letter-spacing:-.035em; }
      .panel h2 { line-height:1.6; }
      .hero { padding:34px 0 26px; }
      .action-area { gap:9px; }
      .action { padding:15px 9px; min-height:69px; gap:8px; font-size:13px; line-height:1.65; }
      .action.primary { min-height:80px; font-size:16px; }
      .action .symbol { font-size:18px; }
      .panel { border-radius:15px; }
      .gallery-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
      .empty-gallery { min-height:96px; padding:25px 12px; font-size:12px; }
      .topline { font-size:8px; }
    }

    /* 화면의 텍스트·이미지 선택 및 모바일 길게 누르기 메뉴 제한. 신청서 입력란은 예외. */
    body, body * {
      -webkit-user-select:none;
      user-select:none;
      -webkit-touch-callout:none;
    }
    #formPanel input:not([type="hidden"]):not([type="button"]):not([type="submit"]),
    #formPanel textarea,
    #formPanel select,
    #formPanel [contenteditable="true"] {
      -webkit-user-select:text !important;
      user-select:text !important;
      -webkit-touch-callout:default;
    }
    img {
      -webkit-user-drag:none;
      user-drag:none;
    }
    @media (prefers-reduced-motion:reduce) { *,*:before,*:after { animation-duration:.01ms !important; transition-duration:.01ms !important; scroll-behavior:auto !important; } }
  </style>
</head>

  <script>
    // Google Apps Script 웹 앱 배포 후 받은 /exec 주소를 여기에 입력하세요.
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwua-U759D6bJCyrDyq2w-7qmj3QrYJzZ2v1qJg1UQ72sOr8YDd7WaART658lT-N7Nc/exec';
    let backendCallbackSequence = 0;
    const $ = (selector) => document.querySelector(selector);
    const logoFallback = '';
    const state = {
      step: 1,
      progressStart: 0,
      data: { nickname:'', uid:'', ageRange:'', reason:'', tournament:'' },
      errors: {},
      submitting: false
    };
    const questionMeta = [
      { key:'nickname', title:'게임에서 사용하는 닉네임을 알려주세요.', type:'text', placeholder:'게임 닉네임을 입력해 주세요.' },
      { key:'uid', title:'게임 UID를 알려주세요.', type:'text', placeholder:'예: 428BCBA023C04781' },
      { key:'ageRange', title:'연령대를 알려주세요.', type:'text', placeholder:'가입 절차를 위해서만 사용되며, 외부로 공유되지 않습니다.' },
      { key:'reason', title:'ZEUS에 가입하고 싶은 사유를 알려주세요.', type:'textarea', placeholder:'가입을 희망하는 이유를 작성해 주세요.' },
      { key:'tournament', title:'디스코드에 참가하여 토너먼트에 도전할 의향이 있나요?', type:'choice' }
    ];

    function showView(viewId) {
      ['homeView','formView','galleryView'].forEach(id => $('#'+id).classList.toggle('hidden', id !== viewId));
      if (window.setStormActive) window.setStormActive(viewId === 'homeView');
      window.scrollTo({ top:0, behavior:'smooth' });
    }
    function toast(message, warning=false) {
      const el = $('#toast');
      el.textContent = message;
      el.classList.toggle('warning', warning);
      el.classList.add('show');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.remove('show'), 3300);
    }
    function startApplication() {
      state.step = 1;
      state.progressStart = 0;
      state.errors = {};
      state.data = { nickname:'', uid:'', ageRange:'', reason:'', tournament:'' };
      showView('formView');
      renderStep();
    }
    function renderStep() {
      const panel = $('#formPanel');
      if (state.step === 6) { renderReview(); return; }
      const q = questionMeta[state.step - 1];
      const progress = (state.step - 1) * 20;
      let field = '';
      if (q.type === 'textarea') {
        field = `<textarea class="field-area" id="answerField" maxlength="2000" placeholder="${escapeAttribute(q.placeholder)}">${escapeHtml(state.data[q.key])}</textarea>`;
      } else if (q.type === 'choice') {
        field = `<div class="choice-row">
          <button class="choice ${state.data.tournament==='예'?'selected':''}" type="button" data-choice="예" aria-pressed="${state.data.tournament==='예'}">예</button>
          <button class="choice ${state.data.tournament==='아니요'?'selected':''}" type="button" data-choice="아니요" aria-pressed="${state.data.tournament==='아니요'}">아니요</button>
        </div>`;
      } else {
        const max = q.key === 'uid' ? 16 : (q.key === 'nickname' ? 60 : 30);
        field = `<input class="field ${q.key === 'ageRange' ? 'age-range-field' : ''}" id="answerField" type="text" maxlength="${max}" autocomplete="off" spellcheck="false" value="${escapeAttribute(state.data[q.key])}" placeholder="${escapeAttribute(q.placeholder)}">`;
      }
      panel.innerHTML = `
        <div class="eyebrow">APPLICATION · ZEUS CLAN</div>
        <div class="progress-row"><span>가입 신청 절차</span><strong>${state.step} / 5</strong></div>
        <div class="progress" role="progressbar" aria-label="가입 신청 진행도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress}"><span id="progressFill" style="width:${state.progressStart}%"></span></div>
        <div class="question">
          <label for="answerField">${q.title}</label>
          ${field}
          <div class="error" id="fieldError">${escapeHtml(state.errors[q.key] || '')}</div>
          ${q.helper ? `<p class="description">${q.helper}</p>` : ''}
        </div>
        <div class="nav-row">
          <button class="nav-btn prev" id="prevButton" type="button" ${state.step===1?'disabled':''}>이전</button>
          <button class="nav-btn next" id="nextButton" type="button">다음</button>
        </div>`;

      const progressFill = $('#progressFill');
      if (progressFill) {
        // Establish the previous width before triggering the transition.
        void progressFill.offsetWidth;
        requestAnimationFrame(() => {
          if (progressFill.isConnected) progressFill.style.width = `${progress}%`;
        });
        state.progressStart = progress;
      }

      const input = $('#answerField');
      if (input) {
        input.addEventListener('input', () => {
          if (q.key === 'uid') {
            const original = input.value;
            const start = input.selectionStart ?? original.length;
            const cleaned = original.toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (cleaned !== original) {
              const cursor = original.slice(0, start).toUpperCase().replace(/[^A-Z0-9]/g, '').length;
              input.value = cleaned;
              input.setSelectionRange(cursor, cursor);
            }
            state.data.uid = cleaned;
          } else {
            state.data[q.key] = input.value;
          }
          clearCurrentError(q.key);
        });
        input.addEventListener('focus', () => clearCurrentError(q.key));
      }
      panel.querySelectorAll('[data-choice]').forEach(button => button.addEventListener('click', () => {
        state.data.tournament = button.dataset.choice;
        clearCurrentError('tournament');
        renderStep();
        $('#nextButton').focus({preventScroll:true});
      }));
      $('#prevButton').addEventListener('click', () => { if (state.step > 1) { state.step--; state.errors = {}; renderStep(); } });
      $('#nextButton').addEventListener('click', goNext);
      if (state.step === 1 && input) input.focus({preventScroll:true});
    }
    function clearCurrentError(key) {
      if (!state.errors[key]) return;
      delete state.errors[key];
      const error = $('#fieldError');
      if (error) error.textContent = '';
    }
    function validateStep() {
      const q = questionMeta[state.step - 1];
      const value = state.data[q.key];
      if (!String(value || '').trim()) {
        state.errors[q.key] = '답변을 입력해 주세요.';
        return false;
      }
      if (q.key === 'uid' && !/^[A-NP-Z0-9]{15,16}$/.test(String(value).toUpperCase())) {
        state.errors.uid = '게임 UID를 다시 확인해주세요.';
        return false;
      }
      if (q.key === 'ageRange' && !/[0-9]/.test(String(value))) {
        state.errors.ageRange = '숫자를 포함해주세요.';
        return false;
      }
      delete state.errors[q.key];
      return true;
    }
    function goNext() {
      if (!validateStep()) {
        const error = $('#fieldError');
        if (error) error.textContent = state.errors[questionMeta[state.step-1].key];
        return;
      }
      state.step++;
      renderStep();
    }
    function renderReview() {
      const panel = $('#formPanel');
      const rows = [
        ['게임 닉네임',state.data.nickname,0],
        ['게임 UID',state.data.uid,1],
        ['연령대',state.data.ageRange,2],
        ['가입 이유',state.data.reason,3],
        ['토너먼트 도전 의향',state.data.tournament,4]
      ];
      panel.innerHTML = `
        <div class="review-head"><div class="eyebrow">FINAL CHECK</div><h2>마지막으로 확인해주세요.</h2><p class="description">작성하신 내용이 맞는지 확인한 뒤 가입 신청을 완료해 주세요.</p></div>
        <div class="review-list">${rows.map(row => `
          <div class="review-item"><div><div class="label">${row[0]}</div><div class="answer">${escapeHtml(row[1])}</div></div><button class="edit-btn" type="button" data-edit="${row[2]}">수정</button></div>
        `).join('')}</div>
        <button class="submit-btn" id="submitButton" type="button">가입 신청하기</button>`;
      panel.querySelectorAll('[data-edit]').forEach(button => button.addEventListener('click', () => {
        state.progressStart = 100;
        state.step = Number(button.dataset.edit) + 1;
        state.errors = {};
        renderStep();
      }));
      $('#submitButton').addEventListener('click', submitForm);
    }
    async function submitForm() {
      if (state.submitting) return;
      if (!isBackendConfigured()) {
        toast('관리자 설정이 필요합니다. 배포 주소를 확인해 주세요.', true);
        return;
      }
      state.submitting = true;
      const button = $('#submitButton');
      button.disabled = true;
      button.innerHTML = '<span class="loader"></span>신청 내용 확인 중';
      const payload = { ...state.data };
      try {
        const result = await submitApplicationThroughBackend(payload);
        state.submitting = false;
        renderCompletion();
        if (result && result.emailSent === false) {
          console.warn('신청은 저장되었으나 운영진 이메일 알림은 전송되지 않았습니다.');
        }
      } catch (error) {
        state.submitting = false;
        button.disabled = false;
        button.textContent = '가입 신청하기';
        toast((error && error.message) ? error.message : '신청 처리 중 오류가 발생했습니다. 다시 시도해 주세요.', true);
      }
    }

    function isBackendConfigured() {
      return /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(APPS_SCRIPT_URL);
    }

    function callBackendJsonp(action, params = {}) {
      return new Promise((resolve, reject) => {
        if (!isBackendConfigured()) {
          reject(new Error('Google Apps Script 배포 주소가 설정되지 않았습니다.'));
          return;
        }
        const callbackName = `zeusJsonp_${Date.now()}_${++backendCallbackSequence}`;
        const script = document.createElement('script');
        script.async = true;
        let settled = false;
        const cleanup = () => {
          if (settled) return;
          settled = true;
          window.clearTimeout(timeoutId);
          delete window[callbackName];
          script.remove();
        };
        const timeoutId = window.setTimeout(() => {
          cleanup();
          reject(new Error('Google Apps Script 응답 시간이 초과되었습니다.'));
        }, 15000);

        window[callbackName] = (data) => {
          cleanup();
          resolve(data);
        };
        script.onerror = () => {
          cleanup();
          reject(new Error('Google Apps Script에 연결하지 못했습니다.'));
        };
        const query = new URLSearchParams({
          action,
          callback: callbackName,
          cacheBust: String(Date.now()),
          ...params
        });
        script.src = `${APPS_SCRIPT_URL}?${query.toString()}`;
        document.head.appendChild(script);
      });
    }

    function createRequestId() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }
      return `zeus_${Date.now()}_${Math.random().toString(36).slice(2)}_${Math.random().toString(36).slice(2)}`;
    }

    function wait(milliseconds) {
      return new Promise(resolve => window.setTimeout(resolve, milliseconds));
    }

    async function submitApplicationThroughBackend(payload) {
      const requestId = createRequestId();
      const frameName = `zeus_submit_${requestId.replace(/[^A-Za-z0-9_]/g, '_')}`;
      const iframe = document.createElement('iframe');
      iframe.name = frameName;
      iframe.title = '신청 처리';
      iframe.setAttribute('aria-hidden', 'true');
      iframe.style.display = 'none';

      const form = document.createElement('form');
      form.method = 'POST';
      form.action = APPS_SCRIPT_URL;
      form.target = frameName;
      form.acceptCharset = 'UTF-8';
      form.enctype = 'application/x-www-form-urlencoded';
      form.style.display = 'none';

      const addHiddenField = (name, value) => {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = name;
        input.value = value;
        form.appendChild(input);
      };
      addHiddenField('requestId', requestId);
      addHiddenField('payload', JSON.stringify(payload));
      document.body.appendChild(iframe);
      document.body.appendChild(form);

      try {
        // 일반 HTML 폼 POST는 브라우저의 CORS 응답 읽기 제한과 별개로 전송할 수 있습니다.
        form.submit();
        const deadline = Date.now() + 45000;
        let lastConnectionError = null;
        while (Date.now() < deadline) {
          await wait(900);
          let status;
          try {
            status = await callBackendJsonp('submitStatus', { requestId });
            lastConnectionError = null;
          } catch (connectionError) {
            lastConnectionError = connectionError;
            continue;
          }
          if (status && status.status === 'done') return status.result || {};
          if (status && status.status === 'error') {
            throw new Error(status.message || '가입 신청을 처리하지 못했습니다.');
          }
        }
        if (lastConnectionError) {
          throw new Error('신청 처리 결과를 확인하지 못했습니다. 관리자에게 문의하기 전에 신청 내역이 중복 저장되지 않았는지 확인해 주세요.');
        }
        throw new Error('신청 처리 시간이 초과되었습니다. 중복 신청을 피하려면 스프레드시트에 신청 내역이 있는지 먼저 확인해 주세요.');
      } finally {
        form.remove();
        window.setTimeout(() => iframe.remove(), 5000);
      }
    }

    function renderCompletion() {
      const zeusLogo = document.querySelector('.logo-wrap img')?.src || '';
      $('#formPanel').innerHTML = `
        <div class="completion">
          <div class="check"><img src="${zeusLogo}" alt="ZEUS CLAN 로고"></div>
          <h2>신청이 완료되었어요.</h2>
          <p>가입안내방에서 매니저님 확인을 기다려주세요.</p>
          <p class="small">ZEUS CLAN · YOUR LEGEND BEGINS</p>
          <button class="submit-btn" id="completeHome" type="button">메인으로 돌아가기</button>
        </div>`;
      $('#completeHome').addEventListener('click', () => showView('homeView'));
    }
    async function loadHallOfFame() {
      showView('galleryView');
      const content = $('#galleryContent');
      content.innerHTML = '<div class="empty-gallery">명예의 전당을 불러오는 중입니다.</div>';

      if (!isBackendConfigured()) {
        content.innerHTML = '<div class="empty-gallery" role="status">관리자 설정이 필요합니다.<br>잠시 후 다시 이용해 주세요.</div>';
        return;
      }

      try {
        // Gemini 예시와 동일하게 JSONP 대신 fetch()로 일반 JSON 응답을 요청합니다.
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();

        if (!data || data.result !== 'success') {
          throw new Error((data && data.message) || '명예의 전당 응답 오류');
        }

        const images = Array.isArray(data.images) ? data.images : [];
        if (images.length === 0) {
          content.innerHTML = '<div class="empty-gallery" role="status">아직 등록된 기록이 없습니다.</div>';
          return;
        }

        content.innerHTML = '<div class="gallery-grid">' + images.map(item => {
          const imageUrl = item.url || item.src || '';
          return `<article class="gallery-card"><img loading="lazy" src="${escapeAttribute(imageUrl)}" alt=""></article>`;
        }).join('') + '</div>';
      } catch (error) {
        console.error('명예의 전당 불러오기 실패:', error);
        content.innerHTML = '<div class="empty-gallery">명예의 전당을 불러오지 못했습니다.<br>잠시 후 다시 시도해 주세요.</div>';
      }
    }
    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function escapeAttribute(value) { return escapeHtml(value).replace(/`/g,'&#96;'); }

    $('#joinButton').addEventListener('click', startApplication);
    $('#hallButton').addEventListener('click', loadHallOfFame);
    $('#discordButton').addEventListener('click', () => window.open('https://discord.gg/Bd79ZUXdm2','_blank','noopener,noreferrer'));
    $('#formBack').addEventListener('click', () => showView('homeView'));
    $('#galleryBack').addEventListener('click', () => showView('homeView'));

    // 가입 신청서에서 Enter를 누르면 '다음' 버튼과 같은 동작을 수행합니다.
    // 서술형 답변에서 Shift+Enter를 누르면 줄바꿈을 입력할 수 있습니다.
    // 한글 조합 중 Enter는 가로채지 않아 입력이 끊기지 않도록 합니다.
    $('#formPanel').addEventListener('keydown', event => {
      if (event.key !== 'Enter' || event.isComposing || event.keyCode === 229) return;
      const target = event.target;

      if (target.matches('#answerField')) {
        if (target.tagName === 'TEXTAREA' && event.shiftKey) return;
        event.preventDefault();
        goNext();
        return;
      }

      // 선택형 질문에서 선택지를 키보드로 고른 뒤 Enter를 누르면 다음 단계로 이동합니다.
      if (target.matches('[data-choice]')) {
        event.preventDefault();
        state.data.tournament = target.dataset.choice;
        clearCurrentError('tournament');
        goNext();
      }
    });


    // 텍스트·이미지 선택, 복사, 잘라내기, 붙여넣기 및 우클릭 메뉴 제한.
    // 가입 신청서의 실제 입력란에서는 브라우저 기본 편집 기능을 그대로 허용합니다.
    const applicationEditableSelector = '#formPanel input:not([type="hidden"]):not([type="button"]):not([type="submit"]), #formPanel textarea, #formPanel select, #formPanel [contenteditable="true"]';
    function isApplicationEditableTarget(target) {
      return target instanceof Element && Boolean(target.closest(applicationEditableSelector));
    }

    document.addEventListener('contextmenu', event => {
      if (!isApplicationEditableTarget(event.target)) event.preventDefault();
    }, true);

    document.addEventListener('selectstart', event => {
      if (!isApplicationEditableTarget(event.target)) event.preventDefault();
    }, true);

    document.addEventListener('dragstart', event => {
      if (!isApplicationEditableTarget(event.target)) event.preventDefault();
    }, true);

    ['copy', 'cut', 'paste'].forEach(eventName => {
      document.addEventListener(eventName, event => {
        if (!isApplicationEditableTarget(event.target)) event.preventDefault();
      }, true);
    });

    document.addEventListener('keydown', event => {
      if (!(event.ctrlKey || event.metaKey) || event.altKey || isApplicationEditableTarget(event.target)) return;
      if (['a', 'c', 'x'].includes(String(event.key).toLowerCase())) event.preventDefault();
    }, true);

    // ===== 배경 번개 효과 =====
    // 메인 화면에서만 동작하며, 가입 신청서·명예의 전당으로 이동하면 번개와 번쩍임을 모두 멈추고 숨깁니다.
    // 화면이 넓을수록(컴퓨터) 번개가 더 넓은 가로 범위에, 더 많이, 더 길게 갈라져 칩니다.
    (function () {
      const canvas = document.getElementById('stormCanvas');
      const flash = document.getElementById('stormFlash');
      if (!canvas || !flash) return;
      const ctx = canvas.getContext('2d');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let W = 0, H = 0, active = true, timer = 0, raf = 0;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      const rand = (a, b) => a + Math.random() * (b - a);
      const isWide = () => W >= 900;

      // 중점 변위법으로 갈라진 번개 줄기 생성
      function makePath(x0, y0, x1, y1, spread) {
        let pts = [[x0, y0], [x1, y1]], off = spread;
        for (let i = 0; i < 6; i++) {
          const next = [];
          for (let j = 0; j < pts.length - 1; j++) {
            const a = pts[j], b = pts[j + 1];
            next.push(a, [(a[0] + b[0]) / 2 + (Math.random() - .5) * off, (a[1] + b[1]) / 2 + (Math.random() - .5) * off * .3]);
          }
          next.push(pts[pts.length - 1]);
          pts = next; off *= .55;
        }
        return pts;
      }

      function makeBolt(x, wide) {
        const endY = H * rand(.38, .9);
        const drift = (wide ? W * .16 : W * .22) * (Math.random() - .5) * 2;
        const main = makePath(x, -10, x + drift, endY, wide ? 130 : 70);
        const branches = [];
        const n = wide ? Math.floor(rand(4, 8)) : Math.floor(rand(2, 4));
        for (let i = 0; i < n; i++) {
          const k = Math.floor(rand(main.length * .15, main.length * .85));
          const [bx, by] = main[k];
          const dir = Math.random() < .5 ? -1 : 1;
          const reach = wide ? rand(160, 480) : rand(60, 170);
          const bEndX = bx + dir * reach, bEndY = by + rand(H * .08, H * (wide ? .3 : .2));
          branches.push(makePath(bx, by, bEndX, bEndY, wide ? 70 : 40));
        }
        return { main, branches };
      }

      function strokePath(pts, width, alpha) {
        ctx.beginPath();
        ctx.moveTo(pts[0][0], pts[0][1]);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
        ctx.lineWidth = width;
        ctx.strokeStyle = 'rgba(255,226,95,' + alpha + ')';
        ctx.stroke();
      }

      // 번개의 밝기 곡선(ms): 빠르게 켜졌다가 한 번 깜빡이고 서서히 사라짐
      function envelope(t) {
        if (t < 60) return t / 60;
        if (t < 150) return 1 - (t - 60) / 90 * .65;
        if (t < 210) return .35 + (t - 150) / 60 * .65;
        if (t < 560) return Math.max(0, 1 - (t - 210) / 350);
        return 0;
      }

      function strike() {
        if (!active || document.hidden || reduceMotion.matches) return schedule();
        const wide = isWide();
        const count = wide ? (Math.random() < .35 ? 3 : Math.random() < .7 ? 2 : 1) : (Math.random() < .2 ? 2 : 1);
        const bolts = [];
        for (let i = 0; i < count; i++) {
          // 화면 전체 폭을 구간으로 나눠 구간마다 하나씩 배치 → 넓은 화면에서는 좌우 끝까지 고르게 침
          const x = W * ((i + rand(.08, .92)) / count);
          bolts.push(makeBolt(x, wide));
        }
        flash.style.setProperty('--fx', (bolts[0].main[0][0] / W * 100).toFixed(1) + '%');
        const peak = wide ? .16 : .12;
        const start = performance.now();
        cancelAnimationFrame(raf);
        (function frame(now) {
          if (!active) return;
          const t = now - start, a = envelope(t);
          ctx.clearRect(0, 0, W, H);
          if (a <= 0 && t > 560) { flash.style.opacity = 0; return schedule(); }
          flash.style.opacity = (a * peak).toFixed(3);
          ctx.lineCap = 'round'; ctx.lineJoin = 'round';
          ctx.shadowColor = 'rgba(255,196,30,' + (a * .9).toFixed(2) + ')';
          ctx.shadowBlur = wide ? 22 : 14;
          bolts.forEach(b => {
            b.branches.forEach(br => strokePath(br, 1.1, a * .55));
            strokePath(b.main, wide ? 2.6 : 2, a * .8);
            ctx.shadowBlur = 0; strokePath(b.main, 1, a * .95); ctx.shadowBlur = wide ? 22 : 14;
          });
          raf = requestAnimationFrame(frame);
        })(start);
      }

      // 매우 잦게 치되, 번개가 끝난 뒤 0.15~1.1초 간격을 둠 (번쩍임은 초당 3회 미만 유지)
      function schedule() {
        clearTimeout(timer);
        if (!active) return;
        timer = setTimeout(strike, Math.random() < .3 ? rand(150, 400) : rand(450, 1100));
      }

      window.setStormActive = function (on) {
        active = !!on;
        clearTimeout(timer); cancelAnimationFrame(raf);
        ctx.clearRect(0, 0, W, H);
        flash.style.opacity = 0;
        document.body.classList.toggle('calm', !active);
        if (active) timer = setTimeout(strike, 600);
      };

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { clearTimeout(timer); cancelAnimationFrame(raf); ctx.clearRect(0, 0, W, H); flash.style.opacity = 0; }
        else if (active) schedule();
      });
      window.addEventListener('resize', resize);
      resize();
      window.setStormActive(true);
    })();

  </script>
</body>
</html>
